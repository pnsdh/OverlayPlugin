# Fork-only: merges upstream (OverlayPlugin/OverlayPlugin) main into this fork's main when it
# merges cleanly and builds. On conflict or failure nothing is pushed and the run fails with a
# summary (Issues are disabled on this fork; GitHub mails failed scheduled runs).
# Triggers Fork Release whenever upstream's version has no fork release yet.
# Requires secret SYNC_TOKEN: fine-grained PAT for this repo with Contents + Workflows
# read/write (GITHUB_TOKEN can neither push upstream's workflow changes nor trigger CI).
name: Fork Sync

on:
  schedule:
    - cron: '47 */2 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: windows-latest
    concurrency:
      group: fork-sync
    permissions:
      actions: write
      contents: read
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # gh would otherwise pick the upstream remote added below and target the upstream repo.
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Merge Upstream
        id: merge
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config merge.ours.driver true
          git remote add upstream https://github.com/OverlayPlugin/OverlayPlugin.git
          git fetch --no-tags upstream main
          echo "upstream_sha=$(git rev-parse upstream/main)" >> $GITHUB_OUTPUT
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "::notice::Already up to date with upstream."
            echo "status=uptodate" >> $GITHUB_OUTPUT
            exit 0
          fi
          if git merge --no-edit upstream/main; then
            echo "status=merged" >> $GITHUB_OUTPUT
          else
            git diff --name-only --diff-filter=U > "$RUNNER_TEMP/conflicts.txt"
            git merge --abort
            echo "status=conflict" >> $GITHUB_OUTPUT
            echo "::error::Merge conflict with upstream:"
            cat "$RUNNER_TEMP/conflicts.txt"
            exit 1
          fi

      - name: Check dependencies cache
        if: steps.merge.outputs.status == 'merged'
        id: cache-dependencies
        uses: actions/cache@v5
        with:
          path: |
            ./Thirdparty
            ./OverlayPlugin.Core/Thirdparty
          key: ${{ runner.os }}-overlayplugin-${{ hashFiles('./tools/fetch_deps.ps1', './DEPS.json', './tools/StripFFXIVClientStructs/StripFFXIVClientStructs/StripFFXIVClientStructs.cs') }}
          restore-keys: |
            ${{ runner.os }}-overlayplugin-

      - name: Fetch Dependencies
        if: steps.merge.outputs.status == 'merged' && steps.cache-dependencies.outputs.cache-hit != 'true'
        shell: pwsh
        run: .\tools\fetch_deps.ps1

      - name: Set up msbuild
        if: steps.merge.outputs.status == 'merged'
        uses: microsoft/setup-msbuild@v3

      # Windows PowerShell: see the Build step of fork-release.yml.
      - name: Build Merged Tree
        if: steps.merge.outputs.status == 'merged'
        shell: powershell
        run: |
          .\tools\strip-clientstructs.ps1
          dotnet publish -c release
          if (-not $?) { exit 1 }

      - name: Push
        if: steps.merge.outputs.status == 'merged'
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          remote="https://x-access-token:${SYNC_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push "$remote" HEAD:main

      - name: Trigger Release If Needed
        shell: pwsh
        run: |
          [xml]$props = Get-Content -Path "Directory.Build.props"
          $base = ($props.Project.PropertyGroup.AssemblyVersion | Out-String).Trim()
          if (-not (git tag -l "v$base.*")) {
            echo "::notice::No fork release for upstream $base yet. Triggering Fork Release."
            gh workflow run fork-release.yml --ref main
          }

      - name: Report Failure
        if: failure()
        env:
          STATUS: ${{ steps.merge.outputs.status }}
          UPSTREAM_SHA: ${{ steps.merge.outputs.upstream_sha }}
        run: |
          {
            if [ "$STATUS" = "conflict" ]; then
              echo "Merge conflict with upstream \`$UPSTREAM_SHA\`. Conflicting files:"
              echo
              while read -r f; do echo "- \`$f\`"; done < "$RUNNER_TEMP/conflicts.txt"
              echo
              echo "Resolve locally, then push: \`git fetch upstream && git merge upstream/main\`"
            else
              echo "Sync failed after merging upstream \`$UPSTREAM_SHA\` (build, push or release trigger)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
